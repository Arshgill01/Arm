name: Arm E12a completed-matrix inspection recovery

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CONTRACT_PATH: experiments/e12a_inspection_recovery_contract.json
  CONTRACT_SHA256: 6b2c1159eee5615ba38ecebfc3c8ad5c850f2ec3b9318e6415fa35e63904e13d
  SOURCE_RUN_ID: "30847557186"
  SOURCE_ARTIFACT_NAME: e12a-resume-30847557186-1
  SOURCE_ARTIFACT_ID: "8871558287"
  EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e12a-inspection-recovery-${{ github.run_id }}-${{ github.run_attempt }}
  LLAMA_SOURCE: /tmp/llama.cpp-E12a-inspection
  LLAMA_BUILD: /tmp/llama.cpp-E12a-inspection-build
  INSPECTION_VENV: /tmp/Pareto64-E12a-inspection-venv
  MODEL_ROOT: /tmp/Pareto64-E12a-inspection/models
  HF_HOME: /tmp/Pareto64-E12a-inspection/huggingface

jobs:
  inspect:
    name: Inspect exact completed matrix without recomputation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out frozen inspection-only recovery
        uses: actions/checkout@v7

      - name: Select pinned Python line
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Download exact completed-matrix artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}/completed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify frozen contract and completed bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/build" "$EVIDENCE_DIR/patches" "$MODEL_ROOT"
          test "$(uname -m)" = "aarch64"
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          python3 -m unittest tests.test_e12a tests.test_e12a_resume \
            tests.test_e12a_inspection_recovery
          cp "$CONTRACT_PATH" "$EVIDENCE_DIR/contract.json"
          cp results/manifests/e12a-resume-30847557186.json \
            "$EVIDENCE_DIR/failure-manifest.json"
          cp experiments/e12a_inspection_recovery_freeze.py "$EVIDENCE_DIR/freeze.py"
          cp experiments/e12a_inspection_recovery_ingest.py "$EVIDENCE_DIR/ingest.py"
          cp tests/test_e12a_inspection_recovery.py "$EVIDENCE_DIR/test.py"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            > "$EVIDENCE_DIR/original-artifact.json"
          test "$(jq -r '.name' "$EVIDENCE_DIR/original-artifact.json")" = \
            "$SOURCE_ARTIFACT_NAME"
          test "$(jq -r '.digest' "$EVIDENCE_DIR/original-artifact.json")" = \
            sha256:b5590336f79101eba00e18fa1d2bfd2c52173e437b9fc28a4d0ba2cc3394ffc2
          echo "2338867f1b51341e02d0f63ca4d7281731a94b0738d80413476581ae991a1548  $EVIDENCE_DIR/completed/imatrix.gguf" \
            | sha256sum --check --strict
          test "$(stat --format='%s' "$EVIDENCE_DIR/completed/imatrix.gguf")" = 3010048
          chmod 0444 "$EVIDENCE_DIR/completed/imatrix.gguf"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/repository-commit.txt"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            '{run_id: $run_id, run_attempt: $run_attempt, sha: $sha, ref: $ref, runner_os: $runner_os, runner_arch: $runner_arch}' \
            > "$EVIDENCE_DIR/github.json"

      - name: Rebuild exact native inspector
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$LLAMA_SOURCE"
          git -C "$LLAMA_SOURCE" checkout --detach 876a4321163249c43ca4e986818fab5ab081f282
          test "$(git -C "$LLAMA_SOURCE" rev-parse HEAD)" = \
            876a4321163249c43ca4e986818fab5ab081f282
          test "$(git -C "$LLAMA_SOURCE" describe --tags --exact-match)" = b10216
          for patch_file in \
            patches/llama.cpp/b10216/0001-kleidiai-use-validated-arm-features.patch \
            patches/llama.cpp/0002-arm-q8-vector-narrowing-stores.patch \
            patches/llama.cpp/0003-reasoning-budget-forced-token-guard.patch; do
            cp "$patch_file" "$EVIDENCE_DIR/patches/$(basename "$patch_file")"
            git -C "$LLAMA_SOURCE" apply --check "$GITHUB_WORKSPACE/$patch_file"
            git -C "$LLAMA_SOURCE" apply "$GITHUB_WORKSPACE/$patch_file"
          done
          git -C "$LLAMA_SOURCE" diff --check
          git -C "$LLAMA_SOURCE" diff --binary --full-index HEAD -- \
            > "$EVIDENCE_DIR/source-diff.patch"
          test "$(sha256sum "$EVIDENCE_DIR/source-diff.patch" | cut -d' ' -f1)" = \
            e11cdd41091d5d76b973c67ffcc04429760fbef58c7a2bc971947b80900a9893
          jq '.source' "$CONTRACT_PATH" > "$EVIDENCE_DIR/source.json"
          mapfile -t cmake_args < <(jq -r '.build.cmake_arguments[]' "$CONTRACT_PATH")
          jq '{cmake_arguments: .build.cmake_arguments}' "$CONTRACT_PATH" \
            > "$EVIDENCE_DIR/build/configure-command.json"
          cmake -S "$LLAMA_SOURCE" -B "$LLAMA_BUILD" -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "${cmake_args[@]}" \
            2>&1 | tee "$EVIDENCE_DIR/build/configure.log"
          grep -q 'Using KleidiAI optimized kernels if applicable' \
            "$EVIDENCE_DIR/build/configure.log"
          grep -q 'ARM detected' "$EVIDENCE_DIR/build/configure.log"
          grep -q '^LLAMA_OPENSSL:BOOL=OFF$' "$LLAMA_BUILD/CMakeCache.txt"
          cp "$LLAMA_BUILD/CMakeCache.txt" "$EVIDENCE_DIR/build/CMakeCache.txt"
          /usr/bin/time --verbose --output "$EVIDENCE_DIR/build/build-time.log" \
            cmake --build "$LLAMA_BUILD" --target llama-imatrix --parallel "$(nproc)" \
            2>&1 | tee "$EVIDENCE_DIR/build/build.log"
          ninja -C "$LLAMA_BUILD" -t commands > "$EVIDENCE_DIR/build/build-commands.txt"
          "$LLAMA_BUILD/bin/llama-imatrix" --version 2>&1 \
            | tee "$EVIDENCE_DIR/build/imatrix-version.txt"
          python3 experiments/e7a_runtime_closure.py \
            --server "$LLAMA_BUILD/bin/llama-imatrix" \
            --build-root "$LLAMA_BUILD" \
            --copy-dir "$EVIDENCE_DIR/build/llama-imatrix-runtime-files" \
            --output "$EVIDENCE_DIR/build/llama-imatrix-runtime-closure.json"
          python3 -m venv "$INSPECTION_VENV"
          "$INSPECTION_VENV/bin/python" -m pip install --disable-pip-version-check \
            numpy==2.2.6 2>&1 | tee "$EVIDENCE_DIR/build/inspection-requirements.log"
          "$INSPECTION_VENV/bin/python" -m pip freeze | sort \
            > "$EVIDENCE_DIR/build/inspection-pip-freeze.txt"

      - name: Download and verify exact BF16 model
        run: |
          set -euo pipefail
          repository="$(jq -r '.model.repository' "$CONTRACT_PATH")"
          revision="$(jq -r '.model.revision' "$CONTRACT_PATH")"
          entrypoint="$(jq -r '.model.path' "$CONTRACT_PATH")"
          model="$MODEL_ROOT/$entrypoint"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$model" \
            "https://huggingface.co/$repository/resolve/$revision/$entrypoint?download=true"
          test "$(stat --format='%s' "$model")" = 6866220032
          echo "413b0d1fa42c2656f6c61aab88171191fc2df2d07427d82b047c89ac977bc266  $model" \
            | sha256sum --check --strict
          sha256sum "$model" | tee "$EVIDENCE_DIR/model-sha256.txt"
          echo "$model" > "$EVIDENCE_DIR/model-path.txt"
          df -h | tee "$EVIDENCE_DIR/disk-after-model.txt"

      - name: Inspect exact matrix without recomputation
        run: |
          set -euo pipefail
          matrix="$EVIDENCE_DIR/completed/imatrix.gguf"
          sha256sum "$matrix" | tee "$EVIDENCE_DIR/matrix-before-sha256.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path(os.environ["CONTRACT_PATH"]).read_text())
          evidence = Path(os.environ["EVIDENCE_DIR"])
          replacements = {
              "MODEL_PATH": (evidence / "model-path.txt").read_text().strip(),
              "MATRIX_PATH": str(evidence / "completed/imatrix.gguf"),
          }
          argv = [str(Path(os.environ["LLAMA_BUILD"]) / "bin/llama-imatrix")]
          argv.extend(
              replacements.get(argument, argument)
              for argument in contract["inspection"]["statistics_argv_after_binary"]
          )
          (evidence / "inspection-command.json").write_text(
              json.dumps({"argv": argv}, indent=2, sort_keys=True) + "\n"
          )
          PY
          mapfile -t inspection_argv < <(jq -r '.argv[]' "$EVIDENCE_DIR/inspection-command.json")
          /usr/bin/time --verbose --output "$EVIDENCE_DIR/inspection-time.log" \
            "${inspection_argv[@]}" 2>&1 | tee "$EVIDENCE_DIR/imatrix-statistics.log"
          sha256sum "$matrix" | tee "$EVIDENCE_DIR/matrix-after-sha256.txt"
          cmp "$EVIDENCE_DIR/matrix-before-sha256.txt" \
            "$EVIDENCE_DIR/matrix-after-sha256.txt"
          test "$(stat --format='%a' "$matrix")" = 444
          PYTHONPATH="$LLAMA_SOURCE/gguf-py" "$INSPECTION_VENV/bin/python" \
            -m gguf.scripts.gguf_dump "$matrix" --json --json-array \
            > "$EVIDENCE_DIR/imatrix-metadata.json"

      - name: Independently validate and inventory recovered evidence
        run: |
          set -euo pipefail
          python3 experiments/e12a_inspection_recovery_ingest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract "$CONTRACT_PATH" \
            --root "$GITHUB_WORKSPACE" \
            --output "$EVIDENCE_DIR/summary.json"
          find "$EVIDENCE_DIR" -type f ! -name file-inventory-sha256.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/file-inventory-sha256.txt"
          free -h | tee "$EVIDENCE_DIR/memory-after.txt"
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"

      - name: Upload inspection-only recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e12a-inspection-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: error

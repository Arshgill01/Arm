name: Arm E17a quantized-V compatibility preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CONTRACT_PATH: experiments/e17a_second_successor_contract.json
  CONTRACT_SHA256: c59e527ff3b8f51c5ad2b404b64b4d18f7dff2619a84411d515682bbb0da1e0a
  E9A_RUN_ID: "30764802071"
  E9A_ARTIFACT: e9a-final-service-30764802071-1
  E9A_ARTIFACT_ID: "8838874234"

jobs:
  kv_v_cache_preflight:
    name: Test three frozen global K/V cache pairs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e17a-${{ github.run_id }}-${{ github.run_attempt }}
      E9A_DIR: ${{ github.workspace }}/results/raw/e17a-e9a-prerequisite
      MODEL_ROOT: /tmp/Pareto64-E17a/models

    steps:
      - name: Check out frozen bounded preflight
        uses: actions/checkout@v7

      - name: Download exact retained E9a service artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.E9A_ARTIFACT }}
          path: ${{ env.E9A_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.E9A_RUN_ID }}

      - name: Verify contract, native host, and exact runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p "$EVIDENCE_DIR/frozen-inputs" "$MODEL_ROOT"
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          jq -r '
            .inputs as $inputs
            | $inputs
            | to_entries[]
            | select(.key | endswith("_path"))
            | [$inputs[.key | sub("_path$"; "_sha256")], .value]
            | @tsv
          ' "$CONTRACT_PATH" | while IFS=$'\t' read -r expected input_file; do
            echo "$expected  $input_file" | sha256sum --check --strict
            mkdir -p "$EVIDENCE_DIR/frozen-inputs/$(dirname "$input_file")"
            cp "$input_file" "$EVIDENCE_DIR/frozen-inputs/$input_file"
          done
          python3 -m unittest \
            tests.test_e17a \
            tests.test_e17a_successor \
            tests.test_e17a_second_successor
          echo "39424e7f3a43a3a05b4139609224584945c8da7c1de66a9f224e8c7184de012d  $E9A_DIR/summary.json" \
            | sha256sum --check --strict
          cmp "$E9A_DIR/summary.json" results/manifests/e9a-30764802071.json
          cp -R "$E9A_DIR/builds/e7c_final" "$EVIDENCE_DIR/runtime"
          cp "$E9A_DIR/summary.json" "$EVIDENCE_DIR/e9a-workflow-summary.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$E9A_ARTIFACT_ID" \
            > "$EVIDENCE_DIR/e9a-artifact.json"
          test "$(jq -r '.digest' "$EVIDENCE_DIR/e9a-artifact.json")" = \
            sha256:3d360aed5fd02abf5421c3a23309f1abda56bf5f96c0e406a5c13897c15aae70
          runtime_bin="$EVIDENCE_DIR/runtime/runtime-files/bin"
          chmod +x "$runtime_bin/llama-server"
          ln -sfn libllama-common.so.0.0.10216 "$runtime_bin/libllama-common.so.0"
          ln -sfn libmtmd.so.0.0.10216 "$runtime_bin/libmtmd.so.0"
          ln -sfn libllama.so.0.0.10216 "$runtime_bin/libllama.so.0"
          ln -sfn libggml.so.0.18.0 "$runtime_bin/libggml.so.0"
          ln -sfn libggml-base.so.0.18.0 "$runtime_bin/libggml-base.so.0"
          ln -sfn libggml-cpu.so.0.18.0 "$runtime_bin/libggml-cpu.so.0"
          echo "e15e14bd5d4f86e09a79603862f52db841de758ecc21b2c476a2ba92cc8ee40e  $runtime_bin/llama-server" \
            | sha256sum --check --strict
          echo "LD_LIBRARY_PATH=$runtime_bin" >> "$GITHUB_ENV"
          echo "SERVER=$runtime_bin/llama-server" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$runtime_bin" ldd "$runtime_bin/llama-server" \
            | tee "$EVIDENCE_DIR/runtime-ldd.txt"
          if grep -q 'not found' "$EVIDENCE_DIR/runtime-ldd.txt"; then exit 1; fi
          if grep -Eq 'lib(crypto|ssl)\.so\.3' "$EVIDENCE_DIR/runtime-ldd.txt"; then exit 1; fi
          LD_LIBRARY_PATH="$runtime_bin" "$runtime_bin/llama-server" --version \
            2>&1 | tee "$EVIDENCE_DIR/server-version.txt"
          LD_LIBRARY_PATH="$runtime_bin" "$runtime_bin/llama-server" --help \
            > "$EVIDENCE_DIR/server-help.txt"
          grep -q -- '--cache-type-k' "$EVIDENCE_DIR/server-help.txt"
          grep -q -- '--cache-type-v' "$EVIDENCE_DIR/server-help.txt"
          grep -q -- '--flash-attn' "$EVIDENCE_DIR/server-help.txt"
          cp "$CONTRACT_PATH" "$EVIDENCE_DIR/contract.json"
          cp experiments/e17a_tasks.json "$EVIDENCE_DIR/tasks.json"
          cp experiments/e17a_kv_preflight_cell.sh "$EVIDENCE_DIR/cell.sh"
          cp experiments/e17a_kv_preflight_freeze.py "$EVIDENCE_DIR/freeze.py"
          cp experiments/e17a_kv_preflight_ingest.py "$EVIDENCE_DIR/ingest.py"
          cp tests/test_e17a.py "$EVIDENCE_DIR/test.py"
          cp results/manifests/e17a-30855155720.json "$EVIDENCE_DIR/first-failure.json"
          cp experiments/e17a_successor_freeze.py "$EVIDENCE_DIR/successor-freeze.py"
          cp experiments/e17a_successor_ingest.py "$EVIDENCE_DIR/successor-ingest.py"
          cp tests/test_e17a_successor.py "$EVIDENCE_DIR/successor-test.py"
          cp results/manifests/e17a-30855793293.json "$EVIDENCE_DIR/second-failure.json"
          cp experiments/e17a_probe_failure_retain.py "$EVIDENCE_DIR/second-failure-retain.py"
          cp experiments/e17a_subset_probe.py "$EVIDENCE_DIR/subset-probe.py"
          cp experiments/e17a_second_successor_freeze.py "$EVIDENCE_DIR/second-successor-freeze.py"
          cp experiments/e17a_second_successor_ingest.py "$EVIDENCE_DIR/second-successor-ingest.py"
          cp tests/test_e17a_second_successor.py "$EVIDENCE_DIR/second-successor-test.py"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          python3 --version | tee "$EVIDENCE_DIR/python-version.txt"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/repository-commit.txt"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            '{run_id: $run_id, run_attempt: $run_attempt, sha: $sha, ref: $ref, runner_os: $runner_os, runner_arch: $runner_arch}' \
            > "$EVIDENCE_DIR/github.json"

      - name: Download and verify exact selected model
        run: |
          set -euo pipefail
          repository="$(jq -r '.selected.repository' "$CONTRACT_PATH")"
          revision="$(jq -r '.selected.revision' "$CONTRACT_PATH")"
          entrypoint="$(jq -r '.selected.path' "$CONTRACT_PATH")"
          model_sha="$(jq -r '.selected.model_sha256' "$CONTRACT_PATH")"
          model_size="$(jq -r '.selected.model_size_bytes' "$CONTRACT_PATH")"
          MODEL="$MODEL_ROOT/$entrypoint"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$MODEL" \
            "https://huggingface.co/$repository/resolve/$revision/$entrypoint?download=true"
          test "$(stat --format='%s' "$MODEL")" = "$model_size"
          echo "$model_sha  $MODEL" | sha256sum --check --strict
          sha256sum "$MODEL" | tee "$EVIDENCE_DIR/model-sha256.txt"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Run all three frozen compatibility cells
        run: |
          set -euo pipefail
          index=0
          while IFS= read -r configuration; do
            index=$((index + 1))
            printf -v cell_index '%02d' "$index"
            cell_dir="$EVIDENCE_DIR/cells/${cell_index}-${configuration}"
            mkdir -p "$cell_dir"
            set +e
            bash experiments/e17a_kv_preflight_cell.sh "$cell_index" "$configuration"
            caller_status=$?
            set -e
            echo "$caller_status" > "$cell_dir/caller-exit.txt"
          done < <(jq -r '.execution.order[]' "$CONTRACT_PATH")
          test "$index" -eq 3

      - name: Independently validate bounded preflight
        run: |
          set -euo pipefail
          python3 experiments/e17a_second_successor_ingest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract "$CONTRACT_PATH" \
            --root "$GITHUB_WORKSPACE" \
            --output "$EVIDENCE_DIR/summary.json"
          find "$EVIDENCE_DIR" -type f ! -name file-inventory-sha256.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/file-inventory-sha256.txt"
          free -h | tee "$EVIDENCE_DIR/memory-after.txt"
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"
          jq '{status, cells, decision, validation}' "$EVIDENCE_DIR/summary.json"

      - name: Upload complete E17a evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e17a-kv-v-cache-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: error

name: Arm E11a safe-sampled stock quant frontier

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CONTRACT_PATH: experiments/e11a_successor_contract.json
  CONTRACT_SHA256: 277ee27e62dec502c51fb1b5dbb3bb068b27880b8d36401db8ad1a54494448ce
  E10F_CONTRACT_PATH: experiments/e10f_contract.json
  ADAPTER_CONTRACT_PATH: experiments/e10d_contract.json
  RUNTIME_RUN_ID: "30818303255"
  RUNTIME_ARTIFACT: e10d-ministral3_3b_q4_0-30818303255-1
  ANCHOR_RUN_ID: "30829237582"
  ANCHOR_ARTIFACT: e10f-aggregate-30829237582-1

jobs:
  evaluate:
    name: ${{ matrix.candidate }} native safe-sampled stock holdout
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - ministral3_3b_q3_k_s
          - ministral3_3b_q3_k_m
          - ministral3_3b_iq4_xs
          - ministral3_3b_iq4_nl
          - ministral3_3b_q4_k_s
          - ministral3_3b_q5_k_m
          - ministral3_3b_q6_k
          - ministral3_3b_q8_0
    env:
      CANDIDATE: ${{ matrix.candidate }}
      RUNTIME_DIR: ${{ github.workspace }}/results/raw/e11a-successor-runtime-${{ matrix.candidate }}
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e11a-successor-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
      MODEL_ROOT: /tmp/Pareto64-E11a-successor-${{ matrix.candidate }}/models

    steps:
      - name: Check out frozen E11a successor
        uses: actions/checkout@v7

      - name: Download exact retained probability-scoring runtime
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.RUNTIME_ARTIFACT }}
          path: ${{ env.RUNTIME_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUNTIME_RUN_ID }}

      - name: Revalidate prerequisites and retain immutable evidence
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          while IFS=$'\t' read -r expected input_file; do
            echo "$expected  $input_file" | sha256sum --check --strict
          done < <(jq -r '.inputs as $inputs | $inputs | to_entries[] | select(.key | endswith("_path")) | [$inputs[(.key | sub("_path$"; "_sha256"))], .value] | @tsv' "$CONTRACT_PATH")
          while IFS=$'\t' read -r expected input_file; do
            echo "$expected  $input_file" | sha256sum --check --strict
          done < <(jq -r '.inputs as $inputs | $inputs | to_entries[] | select(.key | endswith("_path")) | [$inputs[(.key | sub("_path$"; "_sha256"))], .value] | @tsv' "$E10F_CONTRACT_PATH")
          python3 -m unittest tests.test_e10d_failure tests.test_e10f tests.test_e11a tests.test_e11a_successor
          python3 experiments/e10d_failure_ingest.py \
            --evidence-dir "$RUNTIME_DIR" \
            --contract "$ADAPTER_CONTRACT_PATH" \
            --root "$GITHUB_WORKSPACE" \
            --model ministral3_3b_q4_0 \
            --run-id "$RUNTIME_RUN_ID" \
            --run-attempt 1 \
            --artifact-name "$RUNTIME_ARTIFACT" \
            --artifact-id 8860154414 \
            --output /tmp/e11a-successor-runtime-summary.json
          cmp /tmp/e11a-successor-runtime-summary.json \
            results/manifests/e10d-ministral3_3b_q4_0-30818303255.json
          echo "$(jq -r '.prerequisite.prepared_sha256' "$CONTRACT_PATH")  $RUNTIME_DIR/prepared.json" \
            | sha256sum --check --strict

          mkdir -p "$EVIDENCE_DIR" "$MODEL_ROOT"
          cp -R "$RUNTIME_DIR/build" "$EVIDENCE_DIR/build"
          cp -R "$RUNTIME_DIR/patches" "$EVIDENCE_DIR/patches"
          cp -R "$RUNTIME_DIR/tasks" "$EVIDENCE_DIR/tasks"
          for file in \
            e9a-contract.json e9b-plan.json models-manifest.json \
            e10b-manifest.json e10c-negative-manifest.json sample-map.json \
            e9b-samples.py requirements.txt generated-sample-map.json \
            source-diff.patch source.json patched-files.txt prepared.json; do
            cp "$RUNTIME_DIR/$file" "$EVIDENCE_DIR/$file"
          done
          cp "$CONTRACT_PATH" "$EVIDENCE_DIR/contract.json"
          cp experiments/e11a_plan.json "$EVIDENCE_DIR/base-plan.json"
          cp experiments/e11a_models.json "$EVIDENCE_DIR/models.json"
          cp "$E10F_CONTRACT_PATH" "$EVIDENCE_DIR/e10f-contract.json"
          cp "$ADAPTER_CONTRACT_PATH" "$EVIDENCE_DIR/e10d-contract.json"
          cp experiments/e10f_cell.sh "$EVIDENCE_DIR/cell-runner.sh"
          cp experiments/e11a_successor_freeze.py "$EVIDENCE_DIR/successor-freeze.py"
          cp experiments/e11a_successor_ingest.py "$EVIDENCE_DIR/successor-ingest.py"
          cp tests/test_e11a_successor.py "$EVIDENCE_DIR/successor-test.py"
          cp results/manifests/e10d-30818303255.json "$EVIDENCE_DIR/e10d-pair-manifest.json"
          cp results/manifests/e10d-ministral3_3b_q4_0-30818303255.json "$EVIDENCE_DIR/e10d-control-manifest.json"
          cp experiments/e10e_probability_plan.json "$EVIDENCE_DIR/e10e-plan.json"
          cp results/manifests/e10e-30827797407.json "$EVIDENCE_DIR/e10e-manifest.json"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          python3 --version | tee "$EVIDENCE_DIR/python-version.txt"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/repository-commit.txt"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runtime_run_id "$RUNTIME_RUN_ID" \
            --arg runtime_artifact "$RUNTIME_ARTIFACT" \
            '{run_id: $run_id, run_attempt: $run_attempt, sha: $sha, ref: $ref, runner_os: $runner_os, runner_arch: $runner_arch, runtime_run_id: $runtime_run_id, runtime_artifact: $runtime_artifact}' \
            > "$EVIDENCE_DIR/github.json"

          runtime_bin="$EVIDENCE_DIR/build/runtime-files/bin"
          chmod +x "$runtime_bin/llama-server"
          ln -sfn libllama-common.so.0.0.10216 "$runtime_bin/libllama-common.so.0"
          ln -sfn libmtmd.so.0.0.10216 "$runtime_bin/libmtmd.so.0"
          ln -sfn libllama.so.0.0.10216 "$runtime_bin/libllama.so.0"
          ln -sfn libggml.so.0.18.0 "$runtime_bin/libggml.so.0"
          ln -sfn libggml-base.so.0.18.0 "$runtime_bin/libggml-base.so.0"
          ln -sfn libggml-cpu.so.0.18.0 "$runtime_bin/libggml-cpu.so.0"
          echo "$(jq -r '.acceptance.server_binary_sha256' "$CONTRACT_PATH")  $runtime_bin/llama-server" \
            | sha256sum --check --strict
          LD_LIBRARY_PATH="$runtime_bin" ldd "$runtime_bin/llama-server" \
            | tee "$EVIDENCE_DIR/reused-runtime-ldd.txt"
          ! grep -q 'not found' "$EVIDENCE_DIR/reused-runtime-ldd.txt"

      - name: Download and verify exact frozen stock model
        run: |
          set -euo pipefail
          repository="$(jq -r '.model_repository.repository' "$CONTRACT_PATH")"
          revision="$(jq -r '.model_repository.revision' "$CONTRACT_PATH")"
          entrypoint="$(jq -r --arg candidate "$CANDIDATE" '.models[] | select(.candidate == $candidate) | .path' "$CONTRACT_PATH")"
          model_sha="$(jq -r --arg candidate "$CANDIDATE" '.models[] | select(.candidate == $candidate) | .sha256' "$CONTRACT_PATH")"
          model_size="$(jq -r --arg candidate "$CANDIDATE" '.models[] | select(.candidate == $candidate) | .size_bytes' "$CONTRACT_PATH")"
          model="$MODEL_ROOT/$entrypoint"
          mkdir -p "$(dirname "$model")"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$model" \
            "https://huggingface.co/$repository/resolve/$revision/$entrypoint?download=true"
          test "$(stat --format='%s' "$model")" = "$model_size"
          echo "$model_sha  $model" | sha256sum --check --strict
          sha256sum "$model" | tee "$EVIDENCE_DIR/model-sha256.txt"

      - name: Score exact prepared workload through safe-sampled adapter
        run: |
          set -euo pipefail
          entrypoint="$(jq -r --arg candidate "$CANDIDATE" '.models[] | select(.candidate == $candidate) | .path' "$CONTRACT_PATH")"
          experiments/e10f_cell.sh \
            "$CONTRACT_PATH" \
            "$ADAPTER_CONTRACT_PATH" \
            "$EVIDENCE_DIR" \
            "$EVIDENCE_DIR/build/runtime-files/bin/llama-server" \
            "$MODEL_ROOT/$entrypoint"

      - name: Independently validate stock cell and inventory evidence
        run: |
          set -euo pipefail
          python3 experiments/e11a_successor_ingest.py cell \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract "$CONTRACT_PATH" \
            --root "$GITHUB_WORKSPACE" \
            --model "$CANDIDATE" \
            --output "$EVIDENCE_DIR/summary.json"
          find "$EVIDENCE_DIR" -type f ! -name file-inventory-sha256.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/file-inventory-sha256.txt"
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"

      - name: Upload complete stock model cell
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e11a-successor-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: Aggregate complete safe-sampled stock quality-size frontier
    needs: evaluate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out frozen E11a successor
        uses: actions/checkout@v7

      - name: Download all eight current-run cells
        uses: actions/download-artifact@v7
        with:
          pattern: e11a-successor-ministral3_3b_*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/raw/e11a-successor-aggregate/cells

      - name: Download exact retained E10f anchor aggregate
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ANCHOR_ARTIFACT }}
          path: results/raw/e11a-successor-aggregate/anchor-workflow
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ANCHOR_RUN_ID }}

      - name: Validate and aggregate all nine frozen stock points
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          echo "c2fd1aef4aa9aa1e8669f0169997caffbfa3561f0da48d110ed9489e471efad6  results/raw/e11a-successor-aggregate/anchor-workflow/summary.json" \
            | sha256sum --check --strict
          mapfile -t summaries < <(find results/raw/e11a-successor-aggregate/cells -name summary.json -type f | sort)
          test "${#summaries[@]}" -eq 8
          args=()
          for summary in "${summaries[@]}"; do
            args+=(--cell "$summary")
          done
          mkdir -p results/raw/e11a-successor-aggregate/combined
          python3 experiments/e11a_successor_ingest.py aggregate \
            --contract "$CONTRACT_PATH" \
            "${args[@]}" \
            --anchor results/manifests/e10f-30829237582.json \
            --output results/raw/e11a-successor-aggregate/combined/summary.json
          cp "$CONTRACT_PATH" results/raw/e11a-successor-aggregate/combined/contract.json
          cp results/manifests/e10f-30829237582.json \
            results/raw/e11a-successor-aggregate/combined/anchor-retained-manifest.json
          cp results/raw/e11a-successor-aggregate/anchor-workflow/summary.json \
            results/raw/e11a-successor-aggregate/combined/anchor-workflow-summary.json
          find results/raw/e11a-successor-aggregate/combined -type f ! -name file-inventory-sha256.txt -print0 \
            | sort -z | xargs -0 sha256sum \
            > results/raw/e11a-successor-aggregate/combined/file-inventory-sha256.txt

      - name: Upload complete stock frontier aggregate
        uses: actions/upload-artifact@v7
        with:
          name: e11a-successor-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/raw/e11a-successor-aggregate/combined
          retention-days: 90
          if-no-files-found: error

name: Arm E22a product-path sidecar scaling preflight

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CONTRACT_PATH: experiments/e22a_contract.json
  CONTRACT_SHA256: 23b4cd7d49eb09ae685713bf19b08676cdf75fc600701fb3c35c7313733c4c86
  SOURCE_RUN_ID: "30851609576"
  SOURCE_ARTIFACT: e16c-shared-repack-arena-30851609576-1
  SELECTED_CANDIDATE: ministral3_3b_q4_k_m

jobs:
  scaling-preflight:
    name: Compare 1, 2, and 4 normal/shared product workers
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e22a-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ARTIFACT_DIR: /tmp/Pareto64-E22a/e16c-retained-artifact
      MODEL_ROOT: /tmp/Pareto64-E22a/models
      SCRATCH_ROOT: /tmp/Pareto64-E22a/scratch
      SIDECAR_PATH: /tmp/Pareto64-E22a/ministral-q4-k-m.sidecar
      INDEX_PATH: /tmp/Pareto64-E22a/ministral-q4-k-m.index.json

    steps:
      - name: Check out frozen E22a preflight
        uses: actions/checkout@v7

      - name: Verify contract, product, host, and profiler boundary
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          jq -r '.inputs | to_entries[] | [.value.sha256, .key] | @tsv' \
            "$CONTRACT_PATH" | while IFS=$'\t' read -r expected input_path; do
              echo "$expected  $input_path" | sha256sum --check --strict
            done
          python3 -m unittest \
            tests.test_e22a \
            tests.test_pareto64_certificate \
            tests.test_pareto64_gateway \
            tests.test_pareto64_deploy \
            tests.test_pareto64_sidecar \
            tests.test_pareto64_cli
          mkdir -p "$EVIDENCE_DIR/cells" "$EVIDENCE_DIR/product" \
            "$EVIDENCE_DIR/runtime" "$MODEL_ROOT" "$SCRATCH_ROOT"
          cp "$CONTRACT_PATH" "$EVIDENCE_DIR/contract.json"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu --all --extended | tee "$EVIDENCE_DIR/lscpu-extended.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          cat /proc/cpuinfo > "$EVIDENCE_DIR/cpuinfo.txt"
          cat /proc/stat > "$EVIDENCE_DIR/proc-stat-before.txt"
          uptime | tee "$EVIDENCE_DIR/uptime-before.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          python3 --version | tee "$EVIDENCE_DIR/python-version.txt"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/repository-commit.txt"
          if command -v perf >/dev/null 2>&1; then
            set +e
            perf stat -x, -e cycles,instructions,branches,branch-misses,cache-misses \
              -- true > "$EVIDENCE_DIR/perf-probe.stdout.txt" \
              2> "$EVIDENCE_DIR/perf-probe.stderr.txt"
            perf_status=$?
            set -e
          else
            perf_status=127
            : > "$EVIDENCE_DIR/perf-probe.stdout.txt"
            echo "perf executable unavailable" > "$EVIDENCE_DIR/perf-probe.stderr.txt"
          fi
          jq -n \
            --argjson exit_status "$perf_status" \
            --rawfile stdout "$EVIDENCE_DIR/perf-probe.stdout.txt" \
            --rawfile stderr "$EVIDENCE_DIR/perf-probe.stderr.txt" \
            '{schema_version: 1, exit_status: $exit_status, available: ($exit_status == 0), stdout: $stdout, stderr: $stderr}' \
            > "$EVIDENCE_DIR/perf-probe.json"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact "$SOURCE_ARTIFACT" \
            '{run_id: $run_id, run_attempt: $run_attempt, sha: $sha, ref: $ref, runner_os: $runner_os, runner_arch: $runner_arch, source_artifact_run_id: $source_run_id, source_artifact: $source_artifact}' \
            > "$EVIDENCE_DIR/github.json"

      - name: Download exact retained E16c runtime closure
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ env.SOURCE_ARTIFACT_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Arshgill01/Arm
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Rehydrate and verify the exact sidecar-capable runtime
        run: |
          set -euo pipefail
          cp -R "$SOURCE_ARTIFACT_DIR/build/runtime-files/bin" \
            "$EVIDENCE_DIR/runtime/bin"
          cp "$SOURCE_ARTIFACT_DIR/build/runtime-closure.json" \
            "$EVIDENCE_DIR/runtime/runtime-closure.json"
          cp "$SOURCE_ARTIFACT_DIR/source.json" "$EVIDENCE_DIR/runtime/source.json"
          cp "$SOURCE_ARTIFACT_DIR/source-diff.patch" \
            "$EVIDENCE_DIR/runtime/source-diff.patch"
          runtime_bin="$EVIDENCE_DIR/runtime/bin"
          chmod +x "$runtime_bin/llama-server"
          ln -sfn libllama-common.so.0.0.10216 "$runtime_bin/libllama-common.so.0"
          ln -sfn libmtmd.so.0.0.10216 "$runtime_bin/libmtmd.so.0"
          ln -sfn libllama.so.0.0.10216 "$runtime_bin/libllama.so.0"
          ln -sfn libggml.so.0.18.0 "$runtime_bin/libggml.so.0"
          ln -sfn libggml-base.so.0.18.0 "$runtime_bin/libggml-base.so.0"
          ln -sfn libggml-cpu.so.0.18.0 "$runtime_bin/libggml-cpu.so.0"
          echo "LD_LIBRARY_PATH=$runtime_bin" >> "$GITHUB_ENV"
          echo "SERVER_PATH=$runtime_bin/llama-server" >> "$GITHUB_ENV"
          expected="$(jq -r '.source_artifact.name' "$CONTRACT_PATH")"
          test "$expected" = "$SOURCE_ARTIFACT"
          echo "$(jq -r '.source_build.runtime_closure.files[] | select(.relative_path == "bin/llama-server") | .sha256' results/manifests/e16c-30851609576.json)  $runtime_bin/llama-server" \
            | sha256sum --check --strict
          LD_LIBRARY_PATH="$runtime_bin" ldd "$runtime_bin/llama-server" \
            | tee "$EVIDENCE_DIR/runtime/ldd.txt"
          ! grep -q 'not found' "$EVIDENCE_DIR/runtime/ldd.txt"
          ! grep -Eq 'lib(ssl|crypto)\.so' "$EVIDENCE_DIR/runtime/ldd.txt"
          LD_LIBRARY_PATH="$runtime_bin" "$runtime_bin/llama-server" --version \
            |& tee "$EVIDENCE_DIR/runtime/server-version.txt"

      - name: Download and verify exact selected model
        run: |
          set -euo pipefail
          repository="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].repository' experiments/e3f_models.json)"
          revision="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].revision' experiments/e3f_models.json)"
          entrypoint="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].entrypoint' experiments/e3f_models.json)"
          model="$MODEL_ROOT/$entrypoint"
          mkdir -p "$(dirname "$model")"
          required=$(( $(jq -r '.selected.model_size_bytes' "$CONTRACT_PATH") * 3 + 536870912 ))
          available="$(df --output=avail -B1 "$MODEL_ROOT" | tail -1 | tr -d ' ')"
          test "$available" -ge "$required"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$model" \
            "https://huggingface.co/$repository/resolve/$revision/$entrypoint?download=true"
          test "$(stat --format='%s' "$model")" = \
            "$(jq -r '.selected.model_size_bytes' "$CONTRACT_PATH")"
          echo "$(jq -r '.selected.model_sha256' "$CONTRACT_PATH")  $model" \
            | sha256sum --check --strict
          echo "MODEL_PATH=$model" >> "$GITHUB_ENV"
          sha256sum "$model" | tee "$EVIDENCE_DIR/model-sha256.txt"

      - name: Construct and independently verify one product sidecar
        run: |
          set -euo pipefail
          python3 -m pareto64 sidecar-prepack \
            --contract experiments/e16c_contract.json \
            --evidence results/manifests/e16c-30851609576.json \
            --model "$MODEL_PATH" \
            --llama-server "$SERVER_PATH" \
            --sidecar "$SIDECAR_PATH" \
            --index "$INDEX_PATH" \
            --receipt "$EVIDENCE_DIR/product/sidecar-receipt.json" \
            --lifecycle-dir "$EVIDENCE_DIR/product/prepack" \
            --scratch-root "$SCRATCH_ROOT" \
            --port 18081 \
            --readiness-timeout 180
          python3 -m pareto64 sidecar-verify \
            --contract experiments/e16c_contract.json \
            --evidence results/manifests/e16c-30851609576.json \
            --model "$MODEL_PATH" \
            --llama-server "$SERVER_PATH" \
            --sidecar "$SIDECAR_PATH" \
            --index "$INDEX_PATH" \
            --receipt "$EVIDENCE_DIR/product/sidecar-receipt.json" \
            --output "$EVIDENCE_DIR/product/sidecar-verification.json"
          df -h | tee "$EVIDENCE_DIR/disk-after-sidecar.txt"

      - name: Run the frozen 1, 2, and 4 worker matrix
        run: |
          set -euo pipefail
          jq -r '.matrix.order[] | [.mode, .workers, .position] | @tsv' \
            "$CONTRACT_PATH" | while IFS=$'\t' read -r mode workers position; do
              experiments/e22a_cell.sh \
                "$EVIDENCE_DIR" \
                "$SERVER_PATH" \
                "$MODEL_PATH" \
                "$SIDECAR_PATH" \
                "$INDEX_PATH" \
                "$EVIDENCE_DIR/product/sidecar-receipt.json" \
                "$mode" "$workers" "$position"
            done

      - name: Independently ingest the complete preflight
        run: |
          set -euo pipefail
          cat /proc/stat > "$EVIDENCE_DIR/proc-stat-after.txt"
          uptime | tee "$EVIDENCE_DIR/uptime-after.txt"
          free -h | tee "$EVIDENCE_DIR/memory-after.txt"
          python3 experiments/e22a_ingest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract "$CONTRACT_PATH" \
            --root "$GITHUB_WORKSPACE" \
            --output "$EVIDENCE_DIR/summary.json"
          test "$(jq -r '.status' "$EVIDENCE_DIR/summary.json")" = \
            valid_sidecar_scaling_preflight
          jq '{status, decision, failed_advance_gates, pairs}' \
            "$EVIDENCE_DIR/summary.json"

      - name: Receipt-bound sidecar cleanup and final inventory
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE_DIR/product/sidecar-receipt.json" \
            && -f "$SIDECAR_PATH" && -f "$INDEX_PATH" ]]; then
            python3 -m pareto64 sidecar-cleanup \
              --receipt "$EVIDENCE_DIR/product/sidecar-receipt.json" \
              --output "$EVIDENCE_DIR/product/sidecar-cleanup.json" \
              --execute
          fi
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"
          find "$EVIDENCE_DIR" -type f ! -name file-inventory-sha256.txt -print0 \
            | sort -z | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/file-inventory-sha256.txt"

      - name: Upload complete E22a evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e22a-sidecar-scaling-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

name: Arm E6c reasoning-budget correctness fix

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_SHA: 9d9a6d29f6b981cc7f41983d26e56485c6af1811
  LLAMA_CPP_TAG: b10208
  KLEIDIAI_RELEASE: v1.24.0
  KLEIDIAI_ARCHIVE_MD5: 2f02ebe29573d45813e671eb304f2a00
  PATCH_SHA256: 2c0c611f325fd036eadaa0b7dc5615898f1ded3f770b0cf8eacb3a472a613783
  MODEL_SHA256: 298fcb5fe7a77ccc79745ae24751560c5ac56874caff4bb39b1f2055bd72b8bb
  MODEL_SIZE: "2583221408"
  MODEL_REVISION: e87f176479d0855a907a41277aca2f8ee7a09523

jobs:
  validate:
    name: Native forced-token guard validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e6c-${{ github.run_id }}-${{ github.run_attempt }}
      LLAMA_CPP_DIR: /tmp/llama.cpp-E6c
      BUILD_DIR: /tmp/llama.cpp-E6c-build
      MODEL_PATH: /tmp/Pareto64-E6c/Qwen3.5-4B-Q4_0.gguf
      PATCH_PATH: ${{ github.workspace }}/patches/llama.cpp/0003-reasoning-budget-forced-token-guard.patch

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Select supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Capture host and frozen inputs
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$(dirname "$MODEL_PATH")" \
            "$EVIDENCE_DIR/variants/qwen35_q4_budget0_patched"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          c++ --version | tee "$EVIDENCE_DIR/compiler.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          cp experiments/e6c_contract.json "$EVIDENCE_DIR/contract.json"
          cp experiments/e6c_models.json "$EVIDENCE_DIR/models-manifest.json"
          cp experiments/e3_tasks.json "$EVIDENCE_DIR/tasks-manifest.json"
          cp "$PATCH_PATH" "$EVIDENCE_DIR/patch.patch"
          echo "$PATCH_SHA256  $PATCH_PATH" | sha256sum --check --strict
          echo 'beaf59c9967445df780db02da5f6c92990c51b79afa87e3cb245dda91428d346  experiments/e3_tasks.json' \
            | sha256sum --check --strict
          git clone --filter=blob:none \
            https://github.com/ggml-org/llama.cpp.git "$LLAMA_CPP_DIR"
          git -C "$LLAMA_CPP_DIR" checkout --detach "$LLAMA_CPP_SHA"
          test "$(git -C "$LLAMA_CPP_DIR" rev-parse HEAD)" = "$LLAMA_CPP_SHA"
          test "$(git -C "$LLAMA_CPP_DIR" describe --tags --exact-match)" = "$LLAMA_CPP_TAG"
          test -z "$(git -C "$LLAMA_CPP_DIR" status --short)"
          grep -q 'set(KLEIDIAI_COMMIT_TAG "v1.24.0")' \
            "$LLAMA_CPP_DIR/ggml/src/ggml-cpu/CMakeLists.txt"
          grep -q 'set(KLEIDIAI_RELEASE_ARCHIVE_MD5  "2f02ebe29573d45813e671eb304f2a00")' \
            "$LLAMA_CPP_DIR/ggml/src/ggml-cpu/CMakeLists.txt"
          git -C "$LLAMA_CPP_DIR" apply --check "$PATCH_PATH"
          sha256sum "$LLAMA_CPP_DIR/common/reasoning-budget.cpp" \
            | tee "$EVIDENCE_DIR/source-before-sha256.txt"
          sha256sum "$LLAMA_CPP_DIR/tests/test-reasoning-budget.cpp" \
            | tee "$EVIDENCE_DIR/test-before-sha256.txt"
          echo 'ec9c4d9cbe0d259abc6b2809f9de82ec9d1eef707bc69400576b8535920126fa  /tmp/llama.cpp-E6c/common/reasoning-budget.cpp' \
            | sha256sum --check --strict
          echo '1499e08757ff9e6f52ddd84134a1454346e92cd78a3dc5a9141f8ba775f57979  /tmp/llama.cpp-E6c/tests/test-reasoning-budget.cpp' \
            | sha256sum --check --strict

      - name: Restore pinned Qwen model
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: e6c-qwen35-q4-0-${{ env.MODEL_SHA256 }}

      - name: Fetch and verify pinned Qwen model
        run: |
          set -euo pipefail
          if [ ! -f "$MODEL_PATH" ]; then
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$MODEL_PATH" \
              "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF/resolve/$MODEL_REVISION/Qwen3.5-4B-Q4_0.gguf?download=true"
          fi
          test "$(stat --format='%s' "$MODEL_PATH")" = "$MODEL_SIZE"
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum --check --strict
          find "$(dirname "$MODEL_PATH")" -type f -printf '%P %s bytes\n' | sort \
            | tee "$EVIDENCE_DIR/model-files.txt"
          sha256sum "$MODEL_PATH" | tee "$EVIDENCE_DIR/model-sha256.txt"

      - name: Save verified Qwen model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: e6c-qwen35-q4-0-${{ env.MODEL_SHA256 }}

      - name: Add regression test and configure native build
        run: |
          set -euo pipefail
          git -C "$LLAMA_CPP_DIR" apply \
            --include=tests/test-reasoning-budget.cpp "$PATCH_PATH"
          test "$(git -C "$LLAMA_CPP_DIR" diff --name-only)" = \
            'tests/test-reasoning-budget.cpp'
          sha256sum "$LLAMA_CPP_DIR/tests/test-reasoning-budget.cpp" \
            | tee "$EVIDENCE_DIR/test-after-sha256.txt"
          echo '7ddb412f58edff24f94f66673801f9b9cfa195fbc7c27efcfe3df808fd02cc90  /tmp/llama.cpp-E6c/tests/test-reasoning-budget.cpp' \
            | sha256sum --check --strict
          cmake -S "$LLAMA_CPP_DIR" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_NATIVE=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_CURL=OFF \
            2>&1 | tee "$EVIDENCE_DIR/configure.log"
          grep -q 'Using KleidiAI optimized kernels if applicable' \
            "$EVIDENCE_DIR/configure.log"
          grep -q 'ARM detected' "$EVIDENCE_DIR/configure.log"
          cp "$BUILD_DIR/CMakeCache.txt" "$EVIDENCE_DIR/CMakeCache.txt"
          grep -q '^GGML_CPU_KLEIDIAI:BOOL=ON$' "$EVIDENCE_DIR/CMakeCache.txt"
          grep -q '^GGML_NATIVE:BOOL=ON$' "$EVIDENCE_DIR/CMakeCache.txt"
          grep -q '^LLAMA_BUILD_SERVER:BOOL=ON$' "$EVIDENCE_DIR/CMakeCache.txt"
          grep -q '^LLAMA_BUILD_TESTS:BOOL=ON$' "$EVIDENCE_DIR/CMakeCache.txt"
          grep -Eq '^LLAMA_CURL:(BOOL|UNINITIALIZED)=OFF$' "$EVIDENCE_DIR/CMakeCache.txt"

      - name: Reproduce untouched-source unit failure
        run: |
          set -euo pipefail
          cmake --build "$BUILD_DIR" --target test-reasoning-budget \
            --parallel "$(nproc)" \
            2>&1 | tee "$EVIDENCE_DIR/baseline-build.log"
          set +e
          "$BUILD_DIR/bin/test-reasoning-budget" \
            > "$EVIDENCE_DIR/baseline-test.stdout.log" \
            2> "$EVIDENCE_DIR/baseline-test.stderr.log"
          baseline_status=$?
          set -e
          echo "$baseline_status" | tee "$EVIDENCE_DIR/baseline-test-exit.txt"
          test "$baseline_status" -ne 0
          grep -q 'common_reasoning_budget_get_state(sampler) == REASONING_BUDGET_FORCING' \
            "$EVIDENCE_DIR/baseline-test.stderr.log"

      - name: Apply exact fix and pass complete upstream unit target
        run: |
          set -euo pipefail
          git -C "$LLAMA_CPP_DIR" apply \
            --include=common/reasoning-budget.cpp "$PATCH_PATH"
          git -C "$LLAMA_CPP_DIR" diff --check
          git -C "$LLAMA_CPP_DIR" diff > "$EVIDENCE_DIR/applied.patch"
          cmp "$PATCH_PATH" "$EVIDENCE_DIR/applied.patch"
          git -C "$LLAMA_CPP_DIR" diff --name-only | sort \
            | tee "$EVIDENCE_DIR/changed-files.txt"
          diff -u <(printf '%s\n' common/reasoning-budget.cpp tests/test-reasoning-budget.cpp) \
            "$EVIDENCE_DIR/changed-files.txt"
          sha256sum "$LLAMA_CPP_DIR/common/reasoning-budget.cpp" \
            | tee "$EVIDENCE_DIR/source-after-sha256.txt"
          echo '808b038232e664dccf3ebe678d64597615e34691ddc09d9585db8cab5498c452  /tmp/llama.cpp-E6c/common/reasoning-budget.cpp' \
            | sha256sum --check --strict
          cmake --build "$BUILD_DIR" \
            --target test-reasoning-budget llama-server llama-bench \
            --parallel "$(nproc)" \
            2>&1 | tee "$EVIDENCE_DIR/patched-build.log"
          echo 0 > "$EVIDENCE_DIR/build-exit.txt"
          set +e
          "$BUILD_DIR/bin/test-reasoning-budget" \
            > "$EVIDENCE_DIR/patched-test.stdout.log" \
            2> "$EVIDENCE_DIR/patched-test.stderr.log"
          patched_status=$?
          set -e
          echo "$patched_status" | tee "$EVIDENCE_DIR/patched-test-exit.txt"
          test "$patched_status" -eq 0
          grep -q 'OK (13 tests passed)' "$EVIDENCE_DIR/patched-test.stdout.log"
          "$BUILD_DIR/bin/llama-server" --version \
            > "$EVIDENCE_DIR/server-version.txt" 2>&1

      - name: Prove patched zero-budget behavior on real Arm inference
        run: |
          set -euo pipefail
          variant=qwen35_q4_budget0_patched
          output="$EVIDENCE_DIR/variants/$variant"
          "$BUILD_DIR/bin/llama-bench" \
            --model "$MODEL_PATH" \
            --n-prompt 8 \
            --n-gen 1 \
            --threads 4 \
            --repetitions 1 \
            --output json \
            --verbose \
            > "$output/runtime-proof.json" \
            2> "$output/runtime-proof.stderr.log"
          grep -q 'CPU_KLEIDIAI model buffer size' \
            "$output/runtime-proof.stderr.log"
          /usr/bin/time --verbose --output "$output/server.time.log" \
            "$BUILD_DIR/bin/llama-server" \
            --model "$MODEL_PATH" \
            --alias "$variant" \
            --threads 4 \
            --threads-batch 4 \
            --ctx-size 2048 \
            --parallel 1 \
            --cont-batching \
            --no-cache-prompt \
            --host 127.0.0.1 \
            --port 18080 \
            --no-webui \
            --metrics \
            --slots \
            --jinja \
            --reasoning on \
            --reasoning-format deepseek \
            --reasoning-budget -1 \
            --temp 0 \
            --seed 424242 \
            --log-file "$output/server.core.log" \
            --log-colors off \
            > "$output/server.stdout.log" \
            2> "$output/server.stderr.log" &
          timer_pid=$!
          echo "$timer_pid" > "$output/timer-pid.txt"
          python3 experiments/e3e_http_quality.py wait \
            --url http://127.0.0.1:18080 \
            --timeout 45 \
            --output "$output/readiness.json"
          server_pid=""
          for _ in $(seq 1 50); do
            server_pid="$(pgrep -P "$timer_pid" -x llama-server || true)"
            if [[ -n "$server_pid" ]]; then
              break
            fi
            sleep 0.1
          done
          test -n "$server_pid"
          echo "$server_pid" > "$output/server-pid.txt"
          load_ms="$(jq -r '.ready_ms' "$output/readiness.json")"
          for repetition in 1 2; do
            python3 experiments/e3e_http_quality.py run \
              --url http://127.0.0.1:18080 \
              --tasks experiments/e3_tasks.json \
              --model "$variant" \
              --model-path "$MODEL_PATH" \
              --load-ms "$load_ms" \
              --threads 4 \
              --context 2048 \
              --reasoning-budget-tokens 0 \
              --max-output-tokens 8 \
              --seed 424242 \
              --timeout 30 \
              --output "$output/quality-repeat-$repetition.json"
          done
          curl --fail --silent http://127.0.0.1:18080/metrics \
            > "$output/metrics.txt"
          curl --fail --silent http://127.0.0.1:18080/slots \
            > "$output/slots.json"
          kill -INT "$server_pid"
          set +e
          wait "$timer_pid"
          server_status=$?
          set -e
          echo "$server_status" > "$output/server-shell-exit.txt"
          [[ "$server_status" -eq 0 || "$server_status" -eq 130 ]]

      - name: Validate frozen correctness obligations
        run: |
          set -euo pipefail
          python3 experiments/e3_score.py \
            --models experiments/e6c_models.json \
            --tasks experiments/e3_tasks.json \
            --evidence-dir "$EVIDENCE_DIR" \
            --output "$EVIDENCE_DIR/quality-summary.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          contract = json.loads(Path("experiments/e6c_contract.json").read_text())
          models = json.loads(Path("experiments/e6c_models.json").read_text())
          provenance = {
              "schema_version": 1,
              "experiment_id": "E6c",
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "git_commit": os.environ["GITHUB_SHA"],
              "llama_cpp_commit": os.environ["LLAMA_CPP_SHA"],
              "llama_cpp_tag": os.environ["LLAMA_CPP_TAG"],
              "kleidiai_release": os.environ["KLEIDIAI_RELEASE"],
              "kleidiai_archive_md5": os.environ["KLEIDIAI_ARCHIVE_MD5"],
              "patch_sha256": os.environ["PATCH_SHA256"],
              "source_model_revision": models["source_model"]["revision"],
              "quantization_revision": models["quantization_repository"]["revision"],
              "prior_failure": contract["prior_failure"],
          }
          (evidence / "provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          PY
          python3 experiments/e6c_ingest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract experiments/e6c_contract.json \
            --models experiments/e6c_models.json \
            --tasks experiments/e3_tasks.json \
            --output "$EVIDENCE_DIR/summary.json"
          jq '{status, patch, validation, application: .application.qwen35_q4_budget0_patched | {accuracy: .minimum_accuracy, quality_eligible, final_answer_count, reasoning_characters, generated_tokens, same_text_total_ms, maximum_rss_kib: .quality_process.maximum_rss_kib.max}}' \
            "$EVIDENCE_DIR/summary.json"
          free -h | tee "$EVIDENCE_DIR/memory-after.txt"
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"

      - name: Upload E6c evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e6c-reasoning-budget-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

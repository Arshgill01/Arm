name: Arm E3 Qwen frontier

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLM_RUNNER_SHA: 8ba39e40fa754b87deb99a998c31de3b850094d5
  QWEN_GGUF_REVISION: 91cad51170dc346986eccefdc2dd33a9da36ead9
  QWEN_MNN_REVISION: 4ed860971cc9268355e31e26e6034e2d28e3dc7a

jobs:
  frontier:
    name: Qwen quality, size, speed, and RSS frontier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e3-${{ github.run_id }}-${{ github.run_attempt }}
      LLM_RUNNER_DIR: /tmp/LLM-Runner-E3
      MODEL_ROOT: /tmp/LLM-Runner-E3/e3-models

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Select supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Capture host and pin upstream source
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          free -h | tee "$EVIDENCE_DIR/memory.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          git clone --filter=blob:none https://github.com/Arm-Examples/LLM-Runner.git "$LLM_RUNNER_DIR"
          git -C "$LLM_RUNNER_DIR" checkout --detach "$LLM_RUNNER_SHA"
          test "$(git -C "$LLM_RUNNER_DIR" rev-parse HEAD)" = "$LLM_RUNNER_SHA"

      - name: Restore pinned Qwen artifacts
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MODEL_ROOT }}
          key: e3-qwen25-1b5-${{ env.QWEN_GGUF_REVISION }}-${{ env.QWEN_MNN_REVISION }}

      - name: Fetch and verify pinned Qwen artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/e3-models.tsv"
          import json
          from pathlib import Path

          manifest = json.loads(Path("experiments/e3_models.json").read_text())
          for variant, model in manifest["variants"].items():
              for item in model["files"]:
                  print(
                      variant,
                      model["repository"],
                      model["revision"],
                      item["path"],
                      item["sha256"],
                      item["size_bytes"],
                      sep="\t",
                  )
          PY
          while IFS=$'\t' read -r variant repository revision path sha256 size; do
            target="$MODEL_ROOT/$variant/$path"
            mkdir -p "$(dirname "$target")"
            if [ ! -f "$target" ]; then
              curl --fail --location --retry 5 --retry-all-errors \
                --output "$target" \
                "https://huggingface.co/$repository/resolve/$revision/$path?download=true"
            fi
            test "$(stat --format='%s' "$target")" = "$size"
            echo "$sha256  $target" | sha256sum --check --strict
          done < "$RUNNER_TEMP/e3-models.tsv"
          find "$MODEL_ROOT" -type f -printf '%P %s bytes\n' | sort \
            | tee "$EVIDENCE_DIR/model-files.txt"
          find "$MODEL_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum \
            | tee "$EVIDENCE_DIR/model-sha256.txt"

      - name: Save verified Qwen artifacts
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MODEL_ROOT }}
          key: e3-qwen25-1b5-${{ env.QWEN_GGUF_REVISION }}-${{ env.QWEN_MNN_REVISION }}

      - name: Configure llama.cpp and MNN builds
        run: |
          set -euo pipefail
          for runtime in llama mnn; do
            build="$LLM_RUNNER_DIR/build-$runtime"
            mkdir -p "$EVIDENCE_DIR/build-$runtime"
            if [ "$runtime" = llama ]; then
              framework=llama.cpp
              extra_options=(
                -DCPU_ARCH=Armv8.6_1
                -DGGML_NATIVE=OFF
              )
            else
              framework=mnn
              extra_options=(
                -DMNN_BUILD_LLM_OMNI=OFF
                -DMNN_BUILD_OPENCV=OFF
                -DMNN_IMGCODECS=OFF
              )
            fi
            cmake -S experiments/e3_quality_runner -B "$build" -G Ninja \
              -DBUILD_BENCHMARK=ON \
              -DBUILD_JNI_LIB=OFF \
              -DBUILD_LLM_TESTING=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$LLM_RUNNER_DIR/scripts/cmake/toolchains/native-dispatch.cmake" \
              -DDOWNLOAD_LLM_MODELS=OFF \
              -DLLM_FRAMEWORK="$framework" \
              -DLLM_LOG_LEVEL=INFO \
              -DLLM_RUNNER_SOURCE_DIR="$LLM_RUNNER_DIR" \
              -DPython3_EXECUTABLE="$(command -v python3)" \
              -DUSE_KLEIDIAI=ON \
              "${extra_options[@]}" \
              2>&1 | tee "$EVIDENCE_DIR/build-$runtime/configure.log"
          done
          grep -q 'KleidiAI: ON' "$EVIDENCE_DIR/build-llama/configure.log"
          grep -q 'KleidiAI: ON' "$EVIDENCE_DIR/build-mnn/configure.log"

      - name: Build both runtime harnesses
        run: |
          set -euo pipefail
          for runtime in llama mnn; do
            build="$LLM_RUNNER_DIR/build-$runtime"
            cmake --build "$build" \
              --target e3-quality-cli llm-bench-cli \
              --parallel "$(nproc)" \
              2>&1 | tee "$EVIDENCE_DIR/build-$runtime/build.log"
          done

      - name: Run deterministic quality repetitions
        run: |
          set -euo pipefail
          run_quality() {
            local variant="$1"
            local build="$2"
            local model="$3"
            local output_dir="$EVIDENCE_DIR/variants/$variant"
            mkdir -p "$output_dir"
            for repetition in 1 2; do
              (
                cd "$build/bin"
                export LD_LIBRARY_PATH="$build/bin:$build/lib:${LD_LIBRARY_PATH:-}"
                /usr/bin/time --verbose \
                  --output "$output_dir/quality-repeat-$repetition.time.log" \
                  "$build/e3-quality-cli" \
                  --model "$model" \
                  --tasks "$GITHUB_WORKSPACE/experiments/e3_tasks.json" \
                  --output "$output_dir/quality-repeat-$repetition.json" \
                  --threads 4 \
                  --context 2048 \
                  --max-output-tokens 8 \
                  --shared-library-path "$build/bin"
              ) > "$output_dir/quality-repeat-$repetition.stdout.log" \
                2> "$output_dir/quality-repeat-$repetition.stderr.log"
            done
          }
          run_quality \
            llama_q4_0 \
            "$LLM_RUNNER_DIR/build-llama" \
            "$MODEL_ROOT/llama_q4_0/qwen2.5-1.5b-instruct-q4_0.gguf"
          run_quality \
            llama_q4_k_m \
            "$LLM_RUNNER_DIR/build-llama" \
            "$MODEL_ROOT/llama_q4_k_m/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          run_quality \
            mnn_int4 \
            "$LLM_RUNNER_DIR/build-mnn" \
            "$MODEL_ROOT/mnn_int4"

      - name: Run cyclic performance rounds
        run: |
          set -euo pipefail
          run_benchmark() {
            local variant="$1"
            local round="$2"
            local position="$3"
            local build
            local model
            case "$variant" in
              llama_q4_0)
                build="$LLM_RUNNER_DIR/build-llama"
                model="$MODEL_ROOT/llama_q4_0/qwen2.5-1.5b-instruct-q4_0.gguf"
                ;;
              llama_q4_k_m)
                build="$LLM_RUNNER_DIR/build-llama"
                model="$MODEL_ROOT/llama_q4_k_m/qwen2.5-1.5b-instruct-q4_k_m.gguf"
                ;;
              mnn_int4)
                build="$LLM_RUNNER_DIR/build-mnn"
                model="$MODEL_ROOT/mnn_int4"
                ;;
              *)
                echo "Unknown variant $variant" >&2
                return 1
                ;;
            esac
            local output_dir="$EVIDENCE_DIR/variants/$variant/round-$round-position-$position"
            mkdir -p "$output_dir"
            (
              cd "$build/bin"
              export LD_LIBRARY_PATH="$build/bin:$build/lib:${LD_LIBRARY_PATH:-}"
              /usr/bin/time --verbose --output "$output_dir/time.log" \
                ./llm-bench-cli \
                --model "$model" \
                --input 128 \
                --output 64 \
                --context 2048 \
                --threads 4 \
                --iterations 3 \
                --warmup 1 \
                --json-output "$output_dir/benchmark.json"
            ) > "$output_dir/stdout.log" 2> "$output_dir/stderr.log"
          }
          run_benchmark llama_q4_0 1 1
          run_benchmark llama_q4_k_m 1 2
          run_benchmark mnn_int4 1 3
          run_benchmark llama_q4_k_m 2 1
          run_benchmark mnn_int4 2 2
          run_benchmark llama_q4_0 2 3
          run_benchmark mnn_int4 3 1
          run_benchmark llama_q4_0 3 2
          run_benchmark llama_q4_k_m 3 3

      - name: Score frozen quality policy and record provenance
        run: |
          set -euo pipefail
          python3 experiments/e3_score.py \
            --models experiments/e3_models.json \
            --tasks experiments/e3_tasks.json \
            --evidence-dir "$EVIDENCE_DIR" \
            --output "$EVIDENCE_DIR/quality-summary.json"
          jq '{best_minimum_correct, variants: [.variants | to_entries[] | {variant: .key, minimum_correct: .value.minimum_correct, minimum_accuracy: .value.minimum_accuracy, stable: .value.predictions_stable, eligible: .value.quality_eligible}]}' \
            "$EVIDENCE_DIR/quality-summary.json"
          git -C "$LLM_RUNNER_DIR/build-llama/llama.cpp" rev-parse HEAD \
            > "$EVIDENCE_DIR/llama-cpp-commit.txt"
          git -C "$LLM_RUNNER_DIR/build-mnn/mnn" rev-parse HEAD \
            > "$EVIDENCE_DIR/mnn-commit.txt"
          cp experiments/e3_models.json "$EVIDENCE_DIR/models-manifest.json"
          cp experiments/e3_tasks.json "$EVIDENCE_DIR/tasks-manifest.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          provenance = {
              "experiment_id": "E3",
              "git_commit": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "llm_runner_commit": os.environ["LLM_RUNNER_SHA"],
              "llama_cpp_commit": (evidence / "llama-cpp-commit.txt").read_text().strip(),
              "mnn_commit": (evidence / "mnn-commit.txt").read_text().strip(),
              "model_revisions": {
                  "gguf": os.environ["QWEN_GGUF_REVISION"],
                  "mnn": os.environ["QWEN_MNN_REVISION"],
              },
              "quality": {
                  "repetitions": 2,
                  "tasks": 30,
                  "greedy": True,
                  "max_output_tokens": 8,
                  "absolute_accuracy_floor": 0.75,
                  "maximum_task_deficit_from_best": 1,
                  "stable_predictions_required": True,
              },
              "benchmark": {
                  "execution_order": [
                      ["llama_q4_0", "llama_q4_k_m", "mnn_int4"],
                      ["llama_q4_k_m", "mnn_int4", "llama_q4_0"],
                      ["mnn_int4", "llama_q4_0", "llama_q4_k_m"],
                  ],
                  "input_tokens": 128,
                  "output_tokens": 64,
                  "context": 2048,
                  "threads": 4,
                  "rounds_per_variant": 3,
                  "warmup_iterations_per_round": 1,
                  "measured_iterations_per_round": 3,
              },
          }
          (evidence / "provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          PY
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"

      - name: Upload E3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e3-qwen-frontier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

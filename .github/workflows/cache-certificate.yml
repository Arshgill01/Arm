name: Arm E13a fail-closed cache certificate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CONTRACT_PATH: experiments/e13a_contract.json
  CONTRACT_SHA256: 2c1a9ba6afed27b04cbcc2d82a0153907e8939f196074c536783d7ddb5853226
  CALIBRATION_RUN_ID: "30770403695"
  CALIBRATION_ARTIFACT: e9c-prompt-cache-30770403695-1
  SELECTED_CANDIDATE: ministral3_3b_q4_k_m

jobs:
  certificate:
    name: Exact-fingerprint controller temporal holdout
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CALIBRATION_DIR: ${{ github.workspace }}/results/raw/e13a-calibration
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e13a-cache-certificate-${{ github.run_id }}-${{ github.run_attempt }}
      MODEL_ROOT: /tmp/Pareto64-E13a/models

    steps:
      - name: Check out frozen E13a experiment
        uses: actions/checkout@v7

      - name: Download exact retained E9c calibration artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.CALIBRATION_ARTIFACT }}
          path: ${{ env.CALIBRATION_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Arshgill01/Arm
          run-id: ${{ env.CALIBRATION_RUN_ID }}

      - name: Revalidate calibration and freeze immutable evidence
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          jq -r '.inputs[] | [.sha256, .path] | @tsv' "$CONTRACT_PATH" \
            | while IFS=$'\t' read -r expected input_path; do
                echo "$expected  $input_path" | sha256sum --check --strict
              done
          python3 -m unittest tests.test_e9c tests.test_e13a
          python3 experiments/e9c_ingest.py \
            --evidence-dir "$CALIBRATION_DIR" \
            --contract experiments/e9c_contract.json \
            --root "$GITHUB_WORKSPACE" \
            --output /tmp/e13a-calibration-summary.json
          cmp /tmp/e13a-calibration-summary.json \
            results/manifests/e9c-30770403695.json

          mkdir -p "$EVIDENCE_DIR/cells" "$MODEL_ROOT"
          cp -R "$CALIBRATION_DIR/build" "$EVIDENCE_DIR/build"
          cp -R "$CALIBRATION_DIR/patches" "$EVIDENCE_DIR/patches"
          cp "$CALIBRATION_DIR/source.json" "$EVIDENCE_DIR/source.json"
          cp "$CALIBRATION_DIR/source-diff.patch" "$EVIDENCE_DIR/source-diff.patch"
          cp "$CALIBRATION_DIR/patched-files.txt" "$EVIDENCE_DIR/patched-files.txt"
          cp results/manifests/e9c-30770403695.json \
            "$EVIDENCE_DIR/calibration-manifest.json"
          cp /tmp/e13a-calibration-summary.json \
            "$EVIDENCE_DIR/calibration-summary.json"
          cp "$CONTRACT_PATH" "$EVIDENCE_DIR/contract.json"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          python3 --version | tee "$EVIDENCE_DIR/python-version.txt"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/repository-commit.txt"
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg calibration_run_id "$CALIBRATION_RUN_ID" \
            --arg calibration_artifact "$CALIBRATION_ARTIFACT" \
            '{run_id: $run_id, run_attempt: $run_attempt, sha: $sha, ref: $ref, runner_os: $runner_os, runner_arch: $runner_arch, calibration_run_id: $calibration_run_id, calibration_artifact: $calibration_artifact}' \
            > "$EVIDENCE_DIR/github.json"

          runtime_dir="$EVIDENCE_DIR/build/runtime-files/bin"
          chmod +x "$runtime_dir/llama-server"
          ln -sfn libllama-common.so.0.0.10216 "$runtime_dir/libllama-common.so.0"
          ln -sfn libmtmd.so.0.0.10216 "$runtime_dir/libmtmd.so.0"
          ln -sfn libllama.so.0.0.10216 "$runtime_dir/libllama.so.0"
          ln -sfn libggml.so.0.18.0 "$runtime_dir/libggml.so.0"
          ln -sfn libggml-base.so.0.18.0 "$runtime_dir/libggml-base.so.0"
          ln -sfn libggml-cpu.so.0.18.0 "$runtime_dir/libggml-cpu.so.0"
          echo "$(jq -r '.acceptance.server_binary_sha256' "$CONTRACT_PATH")  $runtime_dir/llama-server" \
            | sha256sum --check --strict
          LD_LIBRARY_PATH="$runtime_dir" ldd "$runtime_dir/llama-server" \
            | tee "$EVIDENCE_DIR/reused-runtime-ldd.txt"
          ! grep -q 'not found' "$EVIDENCE_DIR/reused-runtime-ldd.txt"
          ! grep -Eq 'lib(ssl|crypto)\.so' "$EVIDENCE_DIR/reused-runtime-ldd.txt"

      - name: Download and verify exact selected model
        run: |
          set -euo pipefail
          repository="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].repository' experiments/e3f_models.json)"
          revision="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].revision' experiments/e3f_models.json)"
          entrypoint="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].entrypoint' experiments/e3f_models.json)"
          model="$MODEL_ROOT/$entrypoint"
          mkdir -p "$(dirname "$model")"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$model" \
            "https://huggingface.co/$repository/resolve/$revision/$entrypoint?download=true"
          test "$(stat --format='%s' "$model")" = \
            "$(jq -r '.selected.model_size_bytes' "$CONTRACT_PATH")"
          echo "$(jq -r '.selected.model_sha256' "$CONTRACT_PATH")  $model" \
            | sha256sum --check --strict
          sha256sum "$model" | tee "$EVIDENCE_DIR/model-sha256.txt"

      - name: Run reverse-balanced baseline and fail-closed controller
        run: |
          set -euo pipefail
          entrypoint="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].entrypoint' experiments/e3f_models.json)"
          server="$EVIDENCE_DIR/build/runtime-files/bin/llama-server"
          model="$MODEL_ROOT/$entrypoint"
          index=0
          while IFS=$'\t' read -r policy repetition; do
            index=$((index + 1))
            experiments/e13a_cell.sh \
              "$CONTRACT_PATH" "$EVIDENCE_DIR" "$server" "$model" \
              "$index" "$policy" "$repetition"
          done < <(jq -r '.execution.cell_order[] | [.policy, .repetition] | @tsv' "$CONTRACT_PATH")
          test "$index" -eq 4

      - name: Independently validate and inventory complete evidence
        run: |
          set -euo pipefail
          python3 experiments/e13a_ingest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract "$CONTRACT_PATH" \
            --root "$GITHUB_WORKSPACE" \
            --output "$EVIDENCE_DIR/summary.json"
          jq '{status, eligible, quality, policy, ratios, gates}' \
            "$EVIDENCE_DIR/summary.json"
          find "$EVIDENCE_DIR" -type f ! -name file-inventory-sha256.txt -print0 \
            | sort -z | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/file-inventory-sha256.txt"
          df -h | tee "$EVIDENCE_DIR/disk-after.txt"

      - name: Upload complete E13a evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e13a-cache-certificate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: error

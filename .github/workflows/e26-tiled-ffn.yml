name: Arm E26 rejected fusion validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/e26-tiled-ffn.yml
      - experiments/e26_*
      - patches/llama.cpp/e26/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rejected patch safety and repository checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out E26 branch
        uses: actions/checkout@v7

      - name: Verify retained negative decision
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          jq -e '.decision == "reject" and (.gates.cheap_layer_pass | not)' \
            results/raw/e26a-axion-negative-summary.json

      - name: Run rejected-patch native safety smoke
        run: experiments/e26_rejected_smoke.sh /tmp/e26-rejected-smoke-output

      - name: Run repository validation
        run: |
          python3 -m unittest discover -s tests -q
          python3 scripts/verify_submission.py
          git diff --check

name: Arm E23 Q4_K vector-scale kernel

on:
  workflow_dispatch:
  push:
    branches:
      - codex/arm-native-kernel-speed-pass
    paths:
      - .github/workflows/arm-q4-k-kernel.yml

permissions:
  contents: read

env:
  MODEL_PATH: /tmp/e23-qwen/qwen2.5-1.5b-instruct-q4_k_m.gguf
  MODEL_REVISION: 91cad51170dc346986eccefdc2dd33a9da36ead9
  MODEL_SHA256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
  MODEL_SIZE: "1117320736"

jobs:
  validate:
    name: Matched Q4_K A/B on Arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e23-${{ github.run_id }}-${{ github.run_attempt }}
      E23_WORK_DIR: /tmp/e23-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out experiment repository
        uses: actions/checkout@v7

      - name: Select supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Verify Arm runner prerequisites
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(nproc)" -ge 4
          command -v cmake
          command -v ninja
          command -v taskset
          command -v c++

      - name: Restore pinned Qwen model
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: e23-qwen25-q4-k-m-${{ env.MODEL_SHA256 }}

      - name: Fetch and verify pinned Qwen model
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [[ ! -f "$MODEL_PATH" ]]; then
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$MODEL_PATH" \
              "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/$MODEL_REVISION/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true"
          fi
          test "$(stat --format='%s' "$MODEL_PATH")" = "$MODEL_SIZE"
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum --check --strict

      - name: Save verified Qwen model
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MODEL_PATH }}
          key: e23-qwen25-q4-k-m-${{ env.MODEL_SHA256 }}

      - name: Run correctness-first matched A/B
        id: experiment
        continue-on-error: true
        run: |
          set -euo pipefail
          experiments/e23_arm_kernel_ab.sh "$EVIDENCE_DIR"

      - name: Ingest raw evidence
        id: ingest
        if: always() && hashFiles('results/raw/e23-*/**') != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          experiments/e23_ingest.py "$EVIDENCE_DIR" "$EVIDENCE_DIR/summary.json"
          cat "$EVIDENCE_DIR/summary.json"

      - name: Upload evidence
        if: always() && hashFiles('results/raw/e23-*/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: e23-arm-q4-k-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce experiment completion
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_OUTCOME" = success
          test "$INGEST_OUTCOME" = success

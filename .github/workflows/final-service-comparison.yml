name: Arm E9a final service comparison

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT_PATH: experiments/e9a_contract.json
  CONTRACT_SHA256: 56c275b2f986991688dd97790fe9d9cfba9213db7b0cfe2614a3c81d0c65f928
  SELECTED_CANDIDATE: ministral3_3b_q4_k_m

jobs:
  compare:
    name: Compare exact E5b and E7c services
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EVIDENCE_DIR: ${{ github.workspace }}/results/raw/e9a-${{ github.run_id }}-${{ github.run_attempt }}
      BASELINE_SOURCE: /tmp/llama.cpp-E9a-e5b
      FINAL_SOURCE: /tmp/llama.cpp-E9a-e7c
      BASELINE_BUILD: /tmp/llama.cpp-E9a-e5b-build
      FINAL_BUILD: /tmp/llama.cpp-E9a-e7c-build
      MODEL_ROOT: /tmp/Pareto64-E9a/models

    steps:
      - name: Check out frozen experiment
        uses: actions/checkout@v7

      - name: Select supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Capture host and verify frozen inputs
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/historical" "$EVIDENCE_DIR/builds" \
            "$EVIDENCE_DIR/patches" "$MODEL_ROOT"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"
          lscpu | tee "$EVIDENCE_DIR/lscpu.txt"
          test "$(uname -m)" = "aarch64"
          python3 --version | tee "$EVIDENCE_DIR/python-version.txt"
          {
            cc --version
            c++ --version
            cmake --version
            ninja --version
          } | tee "$EVIDENCE_DIR/compiler.txt"
          free -h | tee "$EVIDENCE_DIR/memory-before.txt"
          df -h | tee "$EVIDENCE_DIR/disk-before.txt"
          jq -n \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg runner_name "$RUNNER_NAME" \
            --arg image_os "${ImageOS:-unknown}" \
            --arg image_version "${ImageVersion:-unknown}" \
            '{runner_os: $runner_os, runner_arch: $runner_arch, runner_name: $runner_name, image_os: $image_os, image_version: $image_version}' \
            > "$EVIDENCE_DIR/environment.json"
          echo "$CONTRACT_SHA256  $CONTRACT_PATH" | sha256sum --check --strict
          cp "$CONTRACT_PATH" "$EVIDENCE_DIR/contract.json"
          while IFS=$'\t' read -r source target expected; do
            echo "$expected  $source" | sha256sum --check --strict
            cp "$source" "$EVIDENCE_DIR/$target"
          done < <(jq -r '.inputs | [
            [.manifest_path, "selected-manifest.json", .manifest_sha256],
            [.models_path, "models-manifest.json", .models_sha256],
            [.tasks_path, "tasks-manifest.json", .tasks_sha256],
            [.e5b_manifest_path, "e5b-manifest.json", .e5b_manifest_sha256],
            [.e5b_report_path, "e5b-report.md", .e5b_report_sha256],
            [.e5b_contract_path, "e5b-contract.json", .e5b_contract_sha256],
            [.e7c_manifest_path, "e7c-manifest.json", .e7c_manifest_sha256],
            [.e7c_contract_path, "e7c-contract.json", .e7c_contract_sha256],
            [.e7c_runtime_contract_path, "e7c-runtime-contract.json", .e7c_runtime_contract_sha256]
          ][] | @tsv' "$CONTRACT_PATH")
          git fetch --no-tags --depth=1 origin \
            beb9614e2329b5b61357fd2f2422bebbb0488a89
          git show beb9614e2329b5b61357fd2f2422bebbb0488a89:.github/workflows/selected-inference.yml \
            > "$EVIDENCE_DIR/historical/e5b_run_git_commit-selected-inference.yml"
          git show beb9614e2329b5b61357fd2f2422bebbb0488a89:pareto64/runtime.py \
            > "$EVIDENCE_DIR/historical/e5b_run_git_commit-runtime.py"
          git fetch --no-tags --depth=1 origin \
            249e0444e95309bbdc8f5f2bdfd4401408ec4511
          git show 249e0444e95309bbdc8f5f2bdfd4401408ec4511:.github/workflows/current-runtime-launch.yml \
            > "$EVIDENCE_DIR/historical/e7c_run_git_commit-current-runtime-launch.yml"
          echo '4767c1bd5f1fe27328239a9cb280f2a01170d20745bc3301a42722f9f17e9eab  '"$EVIDENCE_DIR"'/historical/e5b_run_git_commit-selected-inference.yml' | sha256sum --check --strict
          echo 'd6641398613f7ec8b790258ad24cbc9757e601aa8cf603e51d9c8396690358e8  '"$EVIDENCE_DIR"'/historical/e5b_run_git_commit-runtime.py' | sha256sum --check --strict
          echo '03372c91aecb32f4245913da59a15bcb6070ecc1c3fe8085b4eafc291f6167a1  '"$EVIDENCE_DIR"'/historical/e7c_run_git_commit-current-runtime-launch.yml' | sha256sum --check --strict

      - name: Pin both source revisions and selected model
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://github.com/ggml-org/llama.cpp.git "$BASELINE_SOURCE"
          git -C "$BASELINE_SOURCE" checkout --detach \
            9d9a6d29f6b981cc7f41983d26e56485c6af1811
          test "$(git -C "$BASELINE_SOURCE" rev-parse HEAD)" = \
            9d9a6d29f6b981cc7f41983d26e56485c6af1811
          test "$(git -C "$BASELINE_SOURCE" describe --tags --exact-match)" = b10208
          test -z "$(git -C "$BASELINE_SOURCE" status --short)"

          git clone --filter=blob:none \
            https://github.com/ggml-org/llama.cpp.git "$FINAL_SOURCE"
          git -C "$FINAL_SOURCE" checkout --detach \
            876a4321163249c43ca4e986818fab5ab081f282
          test "$(git -C "$FINAL_SOURCE" rev-parse HEAD)" = \
            876a4321163249c43ca4e986818fab5ab081f282
          test "$(git -C "$FINAL_SOURCE" describe --tags --exact-match)" = b10216
          for patch in \
            patches/llama.cpp/b10216/0001-kleidiai-use-validated-arm-features.patch \
            patches/llama.cpp/0002-arm-q8-vector-narrowing-stores.patch \
            patches/llama.cpp/0003-reasoning-budget-forced-token-guard.patch; do
            expected="$(jq -r --arg path "$patch" '.profiles.e7c_final.source.patches[] | select(.path == $path) | .sha256' "$CONTRACT_PATH")"
            echo "$expected  $patch" | sha256sum --check --strict
            cp "$patch" "$EVIDENCE_DIR/patches/$(basename "$patch")"
            git -C "$FINAL_SOURCE" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$FINAL_SOURCE" apply "$GITHUB_WORKSPACE/$patch"
          done
          git -C "$FINAL_SOURCE" diff --check
          git -C "$FINAL_SOURCE" diff --name-only HEAD | sort \
            | tee "$EVIDENCE_DIR/patched-files.txt"
          git -C "$FINAL_SOURCE" diff --binary --full-index HEAD -- \
            > "$EVIDENCE_DIR/source-diff.patch"
          test "$(sha256sum "$EVIDENCE_DIR/source-diff.patch" | cut -d' ' -f1)" = \
            e11cdd41091d5d76b973c67ffcc04429760fbef58c7a2bc971947b80900a9893
          jq '{e5b_earliest: .profiles.e5b_earliest.source, e7c_final: .profiles.e7c_final.source}' \
            "$CONTRACT_PATH" > "$EVIDENCE_DIR/source.json"

          repository="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].repository' experiments/e3f_models.json)"
          revision="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].revision' experiments/e3f_models.json)"
          model_path="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].files[0].path' experiments/e3f_models.json)"
          model_sha="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].files[0].sha256' experiments/e3f_models.json)"
          model_size="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].files[0].size_bytes' experiments/e3f_models.json)"
          target="$MODEL_ROOT/$SELECTED_CANDIDATE/$model_path"
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$target" \
            "https://huggingface.co/$repository/resolve/$revision/$model_path?download=true"
          test "$(stat --format='%s' "$target")" = "$model_size"
          echo "$model_sha  $target" | sha256sum --check --strict
          sha256sum "$target" | tee "$EVIDENCE_DIR/model-sha256.txt"

      - name: Build and inventory exact service binaries
        run: |
          set -euo pipefail
          for profile in e5b_earliest e7c_final; do
            if [ "$profile" = e5b_earliest ]; then
              source_dir="$BASELINE_SOURCE"
              build_dir="$BASELINE_BUILD"
            else
              source_dir="$FINAL_SOURCE"
              build_dir="$FINAL_BUILD"
            fi
            output_dir="$EVIDENCE_DIR/builds/$profile"
            mkdir -p "$output_dir"
            jq --arg profile "$profile" \
              '{cmake_arguments: .profiles[$profile].build.cmake_arguments}' \
              "$CONTRACT_PATH" > "$output_dir/configure-command.json"
            mapfile -t cmake_args < <(jq -r --arg profile "$profile" \
              '.profiles[$profile].build.cmake_arguments[]' "$CONTRACT_PATH")
            cmake -S "$source_dir" -B "$build_dir" -G Ninja \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              "${cmake_args[@]}" 2>&1 | tee "$output_dir/configure.log"
            grep -q 'Using KleidiAI optimized kernels if applicable' \
              "$output_dir/configure.log"
            grep -q 'ARM detected' "$output_dir/configure.log"
            cp "$build_dir/CMakeCache.txt" "$output_dir/CMakeCache.txt"
            /usr/bin/time --verbose --output "$output_dir/build-time.log" \
              cmake --build "$build_dir" --target llama-server \
                --parallel "$(nproc)" 2>&1 | tee "$output_dir/build.log"
            ninja -C "$build_dir" -t commands > "$output_dir/build-commands.txt"
            "$build_dir/bin/llama-server" --version 2>&1 \
              | tee "$output_dir/server-version.txt"
            python3 experiments/e7a_runtime_closure.py \
              --server "$build_dir/bin/llama-server" \
              --build-root "$build_dir" \
              --copy-dir "$output_dir/runtime-files" \
              --output "$output_dir/runtime-closure.json"
          done

      - name: Run reverse-balanced fresh-process matrix
        run: |
          set -euo pipefail
          active_timer_pid=""
          active_server_pid=""
          cleanup() {
            if [ -n "$active_server_pid" ] && kill -0 "$active_server_pid" 2>/dev/null; then
              kill -INT "$active_server_pid" 2>/dev/null || true
            fi
            if [ -n "$active_timer_pid" ] && kill -0 "$active_timer_pid" 2>/dev/null; then
              wait "$active_timer_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          run_cell() {
            local index="$1"
            local profile="$2"
            local repetition="$3"
            local build_dir
            if [ "$profile" = e5b_earliest ]; then
              build_dir="$BASELINE_BUILD"
            else
              build_dir="$FINAL_BUILD"
            fi
            local server="$build_dir/bin/llama-server"
            local entrypoint
            entrypoint="$(jq -r --arg candidate "$SELECTED_CANDIDATE" '.variants[$candidate].entrypoint' experiments/e3f_models.json)"
            local model="$MODEL_ROOT/$SELECTED_CANDIDATE/$entrypoint"
            local output_dir="$EVIDENCE_DIR/cells/${index}-${profile}-r${repetition}"
            mkdir -p "$output_dir"
            {
              date --utc --iso-8601=seconds
              uptime
              cat /proc/loadavg
              free -h
            } > "$output_dir/runner-state-before.txt"
            PROFILE="$profile" SERVER="$server" MODEL="$model" \
              OUTPUT="$output_dir/recipe.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from experiments.e6f_ingest import capture_server_version
          from experiments.e9a_ingest import expected_server_argv

          contract = json.loads(Path(os.environ["CONTRACT_PATH"]).read_text())
          profile_name = os.environ["PROFILE"]
          profile = contract["profiles"][profile_name]
          server = os.environ["SERVER"]
          model = os.environ["MODEL"]
          selected = contract["selected"]
          recipe = {
              "schema_version": 1,
              "experiment_id": "E9a",
              "profile_name": profile_name,
              "source": profile["source"],
              "build": profile["build"],
              "service": profile["service"],
              "server_path": server,
              "server_version": capture_server_version(server),
              "model": {
                  "path": model,
                  "sha256": selected["model_sha256"],
                  "size_bytes": selected["model_size_bytes"],
              },
              "argv": expected_server_argv(
                  server,
                  model,
                  candidate=selected["candidate"],
                  profile_name=profile_name,
              ),
          }
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(recipe, indent=2, sort_keys=True) + "\n"
          )
          PY
            mapfile -t server_argv < <(jq -r '.argv[]' "$output_dir/recipe.json")
            /usr/bin/time --verbose --output "$output_dir/server-time.log" \
              "${server_argv[@]}" \
              > "$output_dir/server.stdout.log" \
              2> "$output_dir/server.stderr.log" &
            active_timer_pid=$!
            python3 experiments/e3d_http_quality.py wait \
              --url http://127.0.0.1:18081 \
              --timeout 45 \
              --output "$output_dir/readiness.json"
            active_server_pid=""
            for _ in $(seq 1 50); do
              active_server_pid="$(pgrep -P "$active_timer_pid" -x llama-server || true)"
              if [ -n "$active_server_pid" ]; then
                break
              fi
              sleep 0.1
            done
            test -n "$active_server_pid"
            echo "$active_server_pid" > "$output_dir/server-pid.txt"
            probe_args=(
              --url http://127.0.0.1:18081
              --tasks experiments/e3_tasks.json
              --reference-manifest results/manifests/e3f-30656151957.json
              --candidate "$SELECTED_CANDIDATE"
              --configuration "$profile"
              --repetition "$repetition"
              --warmup-task arithmetic-02
              --warmup-task logic-01
              --concurrency 1
              --max-output-tokens 8
              --seed 424242
              --timeout 30
              --experiment-id E9a
              --server-pid "$active_server_pid"
              --output "$output_dir/probe.json"
            )
            if [ "$profile" = e7c_final ]; then
              probe_args+=(--cache-prompt --warmup-slot 0 --warmup-slot 0)
            fi
            python3 experiments/e5b_inference_probe.py "${probe_args[@]}"
            curl --fail --silent http://127.0.0.1:18081/metrics \
              > "$output_dir/metrics.txt"
            curl --fail --silent http://127.0.0.1:18081/slots \
              > "$output_dir/slots.json"
            kill -INT "$active_server_pid"
            set +e
            wait "$active_timer_pid"
            local server_status=$?
            set -e
            echo "$server_status" > "$output_dir/server-shell-exit.txt"
            [[ "$server_status" -eq 0 || "$server_status" -eq 130 ]]
            active_timer_pid=""
            active_server_pid=""
          }

          run_cell 01 e5b_earliest 1
          run_cell 02 e7c_final 1
          run_cell 03 e7c_final 2
          run_cell 04 e5b_earliest 2
          run_cell 05 e7c_final 3
          run_cell 06 e5b_earliest 3
          run_cell 07 e5b_earliest 4
          run_cell 08 e7c_final 4
          trap - EXIT

      - name: Record provenance and independently validate evidence
        run: |
          set -euo pipefail
          jq -n \
            --arg git_commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version: 1, experiment_id: "E9a", git_commit: $git_commit, github_run_id: $run_id, github_run_attempt: $run_attempt}' \
            > "$EVIDENCE_DIR/provenance.json"
          python3 experiments/e9a_ingest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --contract "$CONTRACT_PATH" \
            --root . \
            --output "$EVIDENCE_DIR/summary.json"
          jq '{status, validation, selection, hypothesis, builds: (.builds | with_entries(.value = {server_version: .value.server_version, dynamic_dependency_basenames: .value.dynamic_dependency_basenames, runtime_closure: {file_count: .value.runtime_closure.file_count, total_size_bytes: .value.runtime_closure.total_size_bytes}})), performance: (.performance | with_entries(.value = {throughput: .value.requests_per_second, latency: .value.http_ms, server_cpu_seconds_per_request: .value.server_cpu_seconds_per_request, ready_ms: .value.ready_ms, maximum_rss_kib: .value.maximum_rss_kib, quality: .value.quality}))}' \
            "$EVIDENCE_DIR/summary.json"

      - name: Upload complete E9a evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e9a-final-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
